<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1480" viewBox="0 0 2160 1480" role="img" aria-labelledby="title desc">
<title id="title">Solon System Architecture</title>
<desc id="desc">Solon logical architecture with a browser frontend, one FastAPI backend containing API, agent and domain modules, local persistence, external model and evidence sources, and cross-cutting security and observability. Sessions and schedules use JSON and JSONL. Accounts, academic records and evidence memory use separate SQLite stores.</desc>
