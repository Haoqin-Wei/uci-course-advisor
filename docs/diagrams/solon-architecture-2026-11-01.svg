<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1480" viewBox="0 0 2160 1480" role="img" aria-labelledby="title desc">
<title id="title">Solon 系统模块与组织架构</title>
<desc id="desc">四个上层逻辑模块为浏览器前端、FastAPI API 与上下文编排、Agent 与工具执行、课程领域与推荐服务。后三者属于同一 FastAPI 后端。下层为本地持久化、外部模型与事实数据、安全与可观测性。浏览器通过 HTTP 与 SSE 同 API 交互；Agent 调用外部 DeepSeek；数据适配器查询外部课程来源。会话和规划课表以 JSON 或 JSONL 持久化，账号、学业与长期证据记忆使用独立 SQLite 存储。</desc>
