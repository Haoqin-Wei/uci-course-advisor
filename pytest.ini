[pytest]
minversion = 8.4
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-config
    --strict-markers
    -m "not live and not manual"
    --cov=app
    --cov-report=term-missing
markers =
    live: requires explicitly enabled external API or real LLM access
    manual: excluded from the default test run; execute explicitly by marker
